<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style/index.css">
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center p-5">

    <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-3xl">

        <h1 class="text-3xl font-bold text-center mb-6">
            Administrador de tareas
        </h1>

        <div class="grid md:grid-cols-3 gap-3 mb-5">

            <input
                type="text"
                id="taskInput"
                placeholder="Nueva tarea"
                class="border p-3 rounded-lg"
            >

            <select
                id="category"
                class="border p-3 rounded-lg"
            >
                <option value="📚 Estudio">📚 Estudio</option>
                <option value="💼 Trabajo">💼 Trabajo</option>
                <option value="🏠 Hogar">🏠 Hogar</option>
                <option value="🎮 Ocio">🎮 Ocio</option>
            </select>

            <button
                id="addBtn"
                class="bg-blue-600 text-white rounded-lg hover:bg-blue-700"
            >
                Agregar
            </button>

        </div>

        <div class="flex justify-between mb-4 font-semibold">
            <p>Total: <span id="total">0</span></p>
            <p>Completadas: <span id="completed">0</span></p>
        </div>

        <div id="taskList" class="space-y-3"></div>

    </div>

    <script src="./js/index.js"></script>

</body>
</html>
